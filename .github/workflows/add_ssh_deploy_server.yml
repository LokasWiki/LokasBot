name: deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-lokasbot:
    runs-on: ubuntu-latest
    # Serialize deployments per bot: a new push waits for the previous deploy to
    # finish instead of starting while the old one is still running on the server.
    concurrency:
      group: deploy-lokasbot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to lokasbot
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          # A full deploy (clone + venv setup + test job) can take well over 10
          # minutes; a too-short command_timeout killed the SSH session and
          # orphaned the remote pull.sh (which then held NFS files open and
          # broke every later deploy with "Device or resource busy").
          command_timeout: 30m
          # NOTE: keep this in the proven double-quoted "become sh -c" form.
          # No # comments and no single quotes inside the quoted block:
          # Toolforge's `become` re-parses the argument string, so comments
          # would swallow the rest of the command.
          # $$ is expanded by the login shell to a unique per-run suffix, so
          # each deploy uses its own dir/file and never deletes a dir that a
          # previous (possibly still running) deploy holds open on NFS.
          # pull.sh is copied out and run from home, never from inside the
          # temp dir, so the temp dir is never held open by the running script.
          script: |
            become lokasbot sh -c "
              rm -rf action_temp.$$ pull.$$.sh &&
              git clone https://github.com/LokasWiki/actions.git action_temp.$$ &&
              cp action_temp.$$/lokasbot/pull.sh pull.$$.sh &&
              sh pull.$$.sh &&
              rm -rf action_temp.$$ pull.$$.sh
            "

  deploy-lokasbot2:
    runs-on: ubuntu-latest
    # needs: deploy-lokasbot # remove if you want parallel execution
    concurrency:
      group: deploy-lokasbot2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to lokasbot2
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          command_timeout: 30m
          script: |
            become lokasbot2 sh -c "
              rm -rf action_temp.$$ pull.$$.sh &&
              git clone https://github.com/LokasWiki/actions.git action_temp.$$ &&
              cp action_temp.$$/lokasbot2/pull.sh pull.$$.sh &&
              sh pull.$$.sh &&
              rm -rf action_temp.$$ pull.$$.sh
            "
