name: deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-lokasbot:
    runs-on: ubuntu-latest
    # Serialize deployments per bot: a new push waits for the previous deploy to
    # finish instead of starting while the old one is still running on the server.
    concurrency:
      group: deploy-lokasbot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to lokasbot
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          # Deploy (clone + venv setup + test job) can take well over 10 minutes;
          # a too-short command_timeout killed the SSH session and orphaned the
          # remote pull.sh (which then held NFS files open and broke the next run).
          command_timeout: 30m
          script: |
            become lokasbot sh -c '
              set -e
              # Unique temp dir per run: never rm -rf a dir that a previous run may
              # still hold open (NFS leaves .nfs* lock files -> "Device or resource busy").
              DIR=action_temp.$$
              git clone https://github.com/LokasWiki/actions.git "$DIR"
              # Copy the script out first so it is not executed from inside a dir
              # that gets deleted, and so deleting temp dirs never hits an open file.
              cp "$DIR/lokasbot/pull.sh" pull.sh
              sh pull.sh
              rm -rf "$DIR" pull.sh
            '

  deploy-lokasbot2:
    runs-on: ubuntu-latest
    # needs: deploy-lokasbot # remove if you want parallel execution
    concurrency:
      group: deploy-lokasbot2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to lokasbot2
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          command_timeout: 30m
          script: |
            become lokasbot2 sh -c '
              set -e
              DIR=action_temp.$$
              git clone https://github.com/LokasWiki/actions.git "$DIR"
              cp "$DIR/lokasbot2/pull.sh" pull.sh
              sh pull.sh
              rm -rf "$DIR" pull.sh
            '
