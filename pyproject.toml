[project]
name = "lokasbot"
version = "0.0.0"
description = "LokasBot — Arabic Wikipedia bot"
requires-python = ">=3.10"
dependencies = [
    "mwparserfromhell==0.7.2",
    "pymysql==1.2.0",
    "python-dateutil==2.9.0.post0",
    "pywikibot[mysql,mwoauth]==11.6.0",
    "requests>=2.32.5",
    "SQLAlchemy==2.0.52",
    "typing-extensions==4.16.0",
    "waybackpy~=3.0.6",
    "wikitextparser~=0.56.4",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pylint==4.0.7",
    "pytest==9.1.1",
]

[tool.uv]
package = false
